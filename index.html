<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>LX Music Premium Web</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  /* 网易云音乐 Light Theme Variables */
  --theme-bg: #ffffff;
  --theme-bar: #ffffff;
  --theme-text-main: #333333;
  --theme-text-sub: #888888;
  --border: rgba(0,0,0,0.08);
  --accent: #ec4141; /* 网易红 */
  --accent-hover: #d73a3a;
  
  /* 视图状态变量 */
  --view-text-main: var(--theme-text-main);
  --view-text-sub: var(--theme-text-sub);
  
  --transition: 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
}

body.dark {
  /* 网易云音乐 Dark Theme Variables */
  --theme-bg: #2b2b2b;
  --theme-bar: #222222;
  --theme-text-main: #e0e0e0;
  --theme-text-sub: #888888;
  --border: rgba(255,255,255,0.06);
}

/* 沉浸式歌词模式 */
body.immersion {
  --view-text-main: #ffffff;
  --view-text-sub: rgba(255, 255, 255, 0.6);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { 
  height: 100%; font-family: var(--font); -webkit-font-smoothing: antialiased; 
  overflow: hidden; background: var(--theme-bg); color: var(--theme-text-main);
  user-select: none; -webkit-user-select: none;
  transition: background var(--transition);
}

/* ========== 背景与遮罩层 ========== */
#bgBlur {
  position: absolute; inset: -10%; z-index: 0;
  background-size: cover; background-position: center;
  filter: blur(60px); opacity: 0; 
  transition: opacity 0.6s ease, background-image 0.8s ease;
  pointer-events: none;
}
#bgMask {
  position: absolute; inset: -10%; z-index: 1;
  background: rgba(0,0,0,0.65); opacity: 0; 
  transition: opacity 0.6s ease;
  pointer-events: none;
}
body.immersion #bgBlur { opacity: 1; }
body.immersion #bgMask { opacity: 1; }

/* ========== 连接欢迎页 ========== */
#startupScreen {
  position: absolute; inset: 0; z-index: 1000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--theme-bg); transition: opacity 0.5s ease, visibility 0.5s;
}
#startupScreen.hidden { opacity: 0; visibility: hidden; }
.startup-card {
  background: var(--theme-bar); padding: 50px 40px; border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.1); border: 1px solid var(--border);
  text-align: center; width: 90%; max-width: 380px; position: relative;
}
body.dark .startup-card { box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
.startup-logo i { font-size: 56px; color: var(--accent); margin-bottom: 24px; }
.startup-title { font-size: 22px; font-weight: bold; margin-bottom: 10px; color: var(--theme-text-main); }
.startup-desc { font-size: 13px; color: var(--theme-text-sub); margin-bottom: 30px; }
.input-group input {
  width: 100%; padding: 15px; border-radius: 10px; border: 1px solid var(--border);
  background: rgba(128,128,128,0.05); color: var(--theme-text-main);
  font-size: 15px; outline: none; text-align: center; transition: 0.2s;
  margin-bottom: 24px; font-family: var(--font);
}
.input-group input:focus { border-color: var(--accent); }
.btn-primary {
  width: 100%; padding: 15px; border-radius: 40px; border: none;
  background: var(--accent); color: #fff; font-size: 15px; font-weight: bold;
  cursor: pointer; transition: 0.2s;
}
.btn-primary:hover { background: var(--accent-hover); transform: scale(1.02); }

/* ========== 顶部右侧悬浮栏 ========== */
#topBar {
  position: absolute; top: 0; left: 0; right: 0; height: 70px;
  display: flex; justify-content: flex-end; align-items: center; padding: 0 32px; z-index: 10;
}
.glass-btn {
  width: 34px; height: 34px; border-radius: 50%;
  background: rgba(128, 128, 128, 0.15); backdrop-filter: blur(10px);
  border: 1px solid rgba(128, 128, 128, 0.2); color: var(--theme-text-main);
  display: flex; align-items: center; justify-content: center;
  margin-left: 14px; cursor: pointer; transition: all 0.2s;
  font-size: 14px; font-weight: bold;
}
.glass-btn:hover { background: rgba(128, 128, 128, 0.25); transform: scale(1.08); }
body.immersion .glass-btn { color: #ffffff; background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.2); }

/* ========== 主体视图 ========== */
#playerScreen { position: absolute; inset: 0; display: flex; flex-direction: column; z-index: 1; overflow: hidden; }
#mainView {
  flex: 1; min-height: 0; 
  display: flex; padding: 60px 8vw 0; gap: 8vw;
  align-items: center; justify-content: center; position: relative; z-index: 2;
  color: var(--view-text-main); transition: all 0.5s;
}

#coverSection, body.immersion #coverSection { 
  flex: 0 0 auto; max-width: 360px !important; width: 65vw !important;
  margin: 0 auto !important; align-items: center !important; 
  margin-top: 10px !important; margin-bottom: 15px !important; transition: all 0.3s ease;
}
#artworkWrapper, body.immersion #artworkWrapper {
  width: 100%; aspect-ratio: 1; box-shadow: 0 10px 40px rgba(0,0,0,0.2) !important;
}
body.immersion #coverSection { align-items: flex-end; max-width: 450px; margin: 0; }
#artworkWrapper {
  width: 100%; aspect-ratio: 1; position: relative; border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden; background: rgba(128,128,128,0.1);
  transition: all 0.5s;
}
body.dark #artworkWrapper { box-shadow: 0 15px 40px rgba(0,0,0,0.3); }
body.immersion #artworkWrapper { box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
#albumArt { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s ease; }
#artworkPlaceholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 72px; color: rgba(128,128,128,0.3); }

#lyricSection {
  flex: 1; height: 100%; min-height: 0; max-width: 550px; overflow-y: auto; scroll-behavior: smooth;
  position: relative; text-align: center; display: none;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 85%, transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 85%, transparent 100%);
}
#lyricSection::-webkit-scrollbar { display: none; }
#lyricInner { display: block; position: relative; } 
.lyric-line {
  font-size: 16px; font-weight: 500; color: var(--view-text-sub);
  padding: 14px 20px; cursor: pointer; transition: all 0.3s; line-height: 1.6;
}
.lyric-line:hover { color: var(--view-text-main); }
.lyric-line.active { color: var(--view-text-main); font-size: 26px; font-weight: bold; padding: 24px 20px; text-shadow: 0 2px 12px rgba(0,0,0,0.25); }
body.dark .lyric-line {
    color: rgba(255, 255, 255, 0.75);   /* 非激活歌词偏白半透明 */
}
body.dark .lyric-line.active {
    color: #ffffff;                      /* 激活歌词纯白 */
}
/* ========== 高级感底部控制栏 ========== */
#bottomBar {
  flex-shrink: 0; height: 80px; background: var(--theme-bar); border-top: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center; padding: 0 28px; z-index: 10; position: relative; color: var(--theme-text-main);
}
.bar-left { width: 280px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; }
.mini-cover { width: 48px; height: 48px; border-radius: 6px; background: rgba(128,128,128,0.1); object-fit: cover; }
.song-info { display: flex; flex-direction: column; justify-content: center; overflow: hidden; white-space: nowrap; max-width: 150px; }
.song-name { font-size: 14px; font-weight: 600; text-overflow: ellipsis; overflow: hidden; }
.song-artist { font-size: 12px; color: var(--theme-text-sub); margin-top: 4px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
.heart-btn { font-size: 18px; color: var(--theme-text-sub); background: transparent; border: none; cursor: pointer; transition: 0.2s; margin-left: 6px; }
.heart-btn:hover { color: var(--theme-text-main); transform: scale(1.1); }
.heart-btn.collected { color: var(--accent); }

.bar-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; max-width: 500px; margin: 0 auto; }
.controls-row { display: flex; align-items: center; gap: 32px; margin-bottom: 8px; }
.ctrl-btn { background: transparent; border: none; color: var(--theme-text-main); font-size: 18px; cursor: pointer; transition: 0.2s; opacity: 0.9; }
.ctrl-btn.minor { font-size: 15px; opacity: 0.6; }
.ctrl-btn:hover { opacity: 1; transform: scale(1.1); }
.ctrl-btn:active { transform: scale(0.95); }
.play-btn {
  width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff !important;
  display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 4px 12px rgba(236, 65, 65, 0.25);
}
.play-btn:hover { background: var(--accent-hover); }

/* 控制歌词高亮 */
.lyric-toggle.active { color: var(--accent) !important; opacity: 1 !important; }

.progress-container { width: 100%; display: flex; align-items: center; gap: 12px; font-size: 11px; color: var(--theme-text-sub); font-weight: 500;}
.custom-slider { flex: 1; height: 16px; display: flex; align-items: center; cursor: pointer; position: relative; }
.slider-track { width: 100%; height: 3px; background: var(--border); border-radius: 2px; position: relative; transition: height 0.15s; }
.slider-fill { height: 100%; background: var(--accent); border-radius: 2px; position: relative; }
.custom-slider:hover .slider-track { height: 5px; background: rgba(128,128,128,0.15); }
.slider-thumb {
  position: absolute; right: -5px; top: 50%; transform: translateY(-50%) scale(0);
  width: 10px; height: 10px; background: var(--accent); border-radius: 50%; transition: 0.15s;
}
.custom-slider:hover .slider-thumb { transform: translateY(-50%) scale(1); }

.bar-right { width: 280px; flex-shrink: 0; display: flex; justify-content: flex-end; align-items: center; gap: 20px; }
.vol-slider-wrap { width: 60px; }

/* ========== 自定义 Toast 提示 ========== */
#globalToast {
  position: fixed; top: -60px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.8); color: #fff; padding: 12px 24px;
  border-radius: 8px; font-size: 14px; font-weight: 500;
  backdrop-filter: blur(10px); z-index: 9999; pointer-events: none;
  transition: all 0.4s cubic-bezier(0.25, 0.1, 0.25, 1); box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
#globalToast.show { top: 40px; }

/* ========== 统一现代 UI 组件库 (模态框专用) ========== */
.shared-modal {
  position: fixed; inset: 0; z-index: 3000; display: flex; align-items: center; justify-content: center;
  transition: opacity 0.3s cubic-bezier(0.25, 0.1, 0.25, 1); opacity: 0; pointer-events: none;
}
.shared-modal.show { opacity: 1; pointer-events: auto; }
.shared-modal .modal-mask { position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); }
.shared-modal .modal-content {
  position: relative; z-index: 1; width: 90%; max-width: 520px; max-height: 85vh;
  background: var(--theme-bg); padding: 32px; border-radius: 24px; text-align: center;
  box-shadow: 0 24px 60px rgba(0,0,0,0.25); border: 1px solid rgba(128,128,128,0.08); 
  display: flex; flex-direction: column;
}

/* 现代纤细滚动条 */
.modal-content::-webkit-scrollbar,
#pmSongList::-webkit-scrollbar { width: 5px; background: transparent; }
.modal-content::-webkit-scrollbar-thumb,
#pmSongList::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.15); border-radius: 10px; }
.modal-content::-webkit-scrollbar-thumb:hover,
#pmSongList::-webkit-scrollbar-thumb:hover { background: rgba(128,128,128,0.3); }

/* 现代表单组件 */
.modern-input, .modern-select {
  width: 100%; padding: 14px 18px; border-radius: 14px;
  background: rgba(128,128,128,0.06); border: 1px solid transparent;
  color: var(--theme-text-main); font-size: 15px; outline: none;
  transition: all 0.2s; font-family: inherit;
}
.modern-input:focus, .modern-select:focus { background: rgba(128,128,128,0.03); border-color: var(--accent); }
.modern-select { appearance: none; cursor: pointer; padding-right: 40px; }

/* 现代按钮组件 */
.modern-btn {
  padding: 14px 20px; border-radius: 14px; border: none; cursor: pointer;
  font-size: 15px; font-weight: 600; transition: all 0.2s; display: inline-flex;
  align-items: center; justify-content: center; gap: 8px; font-family: inherit;
}
.modern-btn:active { transform: scale(0.97); }
.modern-btn.primary { background: var(--accent); color: white; }
.modern-btn.primary:hover { background: var(--accent-hover); box-shadow: 0 4px 12px rgba(236, 65, 65, 0.2); }
.modern-btn.default { background: rgba(128,128,128,0.08); color: var(--theme-text-main); }
.modern-btn.default:hover { background: rgba(128,128,128,0.15); }
.modern-btn.danger { background: rgba(255, 77, 79, 0.1); color: #ff4d4f; }
.modern-btn.danger:hover { background: #ff4d4f; color: white; box-shadow: 0 4px 12px rgba(255, 77, 79, 0.2); }
.modern-btn.icon-only { padding: 12px; border-radius: 12px; }

/* 现代歌单列表行交互样式 */
#pmSongList { flex: 1; overflow-y: auto; text-align: left; margin-top: 10px; padding-right: 5px; }
.song-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px; border-radius: 12px; margin-bottom: 2px;
  transition: background 0.2s;
}
.song-item:hover { background: rgba(128, 128, 128, 0.08); }
.song-item.active .song-item-name { color: var(--accent); font-weight: bold; }

.song-item-info { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding-right: 15px; }
.song-item-name { font-size: 15px; color: var(--theme-text-main); font-weight: 500; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; transition: color 0.2s; }
.song-item-artist { font-size: 12px; color: var(--theme-text-sub); margin-top: 4px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }

.song-item-actions { display: flex; gap: 6px; opacity: 0; transition: opacity 0.2s; }
.song-item:hover .song-item-actions { opacity: 1; }
@media (max-width: 768px) { .song-item-actions { opacity: 1; } }

.song-action-btn {
  width: 34px; height: 34px; border-radius: 50%; border: none; background: transparent;
  color: var(--theme-text-sub); cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 14px; transition: all 0.2s;
}
.song-action-btn:hover { background: rgba(128, 128, 128, 0.12); color: var(--theme-text-main); }
.song-action-btn.play:hover { color: var(--accent); }
.song-action-btn.delete:hover { color: #ff4d4f; background: rgba(255, 77, 79, 0.1); }

/* 响应式调整 */
@media (max-width: 900px) {
  #mainView { padding: 60px 5vw 0; gap: 10px; flex-direction: column; justify-content: flex-start; overflow: hidden; }
  #coverSection { flex: 0 0 auto; max-width: 240px; width: 55vw; margin: 0 auto !important; margin-bottom: 10px !important; }
  #lyricSection { display: block !important; flex: 1; max-width: 100%; width: 100%; }
  #lyricInner div:first-child { height: 5vh !important; }
  .lyric-line { padding: 10px 20px; font-size: 15px; }
  .lyric-line.active { padding: 18px 20px; font-size: 22px; }
  #bottomBar { height: 130px; flex-direction: column; padding: 12px 16px; justify-content: center; gap: 10px; flex-shrink: 0; }
  .bar-left { width: 100%; justify-content: center; } 
  .bar-center { width: 100%; max-width: 100%; }
  .controls-row { gap: 40px; margin-bottom: 12px; }
  .bar-right { display: none; }
}

/* ================= 压缩模式下的拖拽支持修复 ================= */
body.compact { background: transparent !important; }
html.compact, body.compact #startupScreen { background: transparent !important; padding: 0; justify-content: center; }

/* 1. 明确赋予有实体背景色的容器 drag 属性 */
body.compact #bottomBar, 
body.compact #startupScreen {
  -webkit-app-region: drag;
}

/* 2. 交互元素绝对取消 drag，防止无法点击 */
body.compact button, 
body.compact input, 
body.compact select,
body.compact .custom-slider, 
body.compact .song-action-btn,
body.compact .compact-close-btn { 
  -webkit-app-region: no-drag; 
}

body.compact .startup-card { width: 100%; height: 100%; max-width: none; border-radius: 12px; padding: 0 15px; display: flex; flex-direction: row; align-items: center; gap: 15px; box-shadow: none; }
body.compact .startup-logo, body.compact .startup-desc, body.compact .startup-title, body.compact #startupScreen .glass-btn { display: none !important; }
body.compact .startup-card .input-group { margin-bottom: 0; flex: 1; }
body.compact .startup-card input { margin-bottom: 0; padding: 8px; font-size: 13px; }
body.compact .startup-card .btn-primary { width: auto; padding: 8px 20px; font-size: 13px; }
body.compact #playerScreen { background: transparent; }
body.compact #topBar, body.compact #mainView, body.compact #bgBlur, body.compact #bgMask { display: none !important; }
body.compact #bottomBar { position: fixed; inset: 0; height: 100% !important; width: 100% !important; display: flex; flex-direction: row !important; align-items: center; justify-content: space-between; padding: 0 15px; border: none; background: var(--theme-bar); border-radius: 12px; }
body.compact .bar-left { width: auto; flex: 1; min-width: 0; margin-right: 15px; }
body.compact .mini-cover { width: 45px; height: 45px; }
body.compact .song-info { max-width: 150px; }
body.compact .bar-center { width: auto; flex: 0 0 auto; max-width: none; margin: 0; }
body.compact .controls-row { margin-bottom: 0; gap: 18px; }
body.compact .progress-container, body.compact .bar-right, body.compact .heart-btn, body.compact .ctrl-btn.minor { display: none !important; }
body.compact #progressTrack { position: absolute; bottom: 0; left: 0; right: 0; height: 2px; padding: 0; }
body.compact .slider-track { height: 2px; }
.compact-close-btn { display: none; }
body.compact .compact-close-btn { display: flex; position: absolute; top: 5px; right: 5px; width: 20px; height: 20px; background: rgb(255, 57, 57); border: none; border-radius: 50%; color:white; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; transition: 0.2s; z-index: 100; }
body.compact .compact-close-btn:hover { background: #ec4141; color: white; }
body.compact #bottomBar:hover .compact-close-btn { opacity: 1; }
</style>
</head>
<body>

<div id="bgBlur"></div>
<div id="bgMask"></div>
<div id="globalToast">提示信息</div>

<!-- 全网搜索模态框 -->
<div id="searchModal" class="shared-modal">
  <div class="modal-mask" onclick="closeSearch()"></div>
  <div class="modal-content">
    <div style="font-size: 32px; color: var(--accent); margin-bottom: 16px;"><i class="fa-brands fa-searchengin"></i></div>
    <h2 id="t-search-title" style="margin-bottom: 24px; font-size: 20px;">跨端点歌 / 搜索</h2>
    <input type="text" id="searchInput" class="modern-input" placeholder="输入 歌曲名 或 歌曲名-歌手..." onkeydown="handleSearch(event)" style="text-align: center;">
    <div style="display: flex; gap: 12px; margin-top: 24px; justify-content: center;">
      <button class="modern-btn primary" id="t-search-play" onclick="executeAction('searchPlay')"><i class="fa-solid fa-play"></i> 直接播放</button>
      <button class="modern-btn default" id="t-search-client" onclick="executeAction('search')"><i class="fa-solid fa-magnifying-glass"></i> 客户端搜索</button>
    </div>
    <div id="t-search-tip" style="margin-top: 20px; font-size: 13px; color: var(--theme-text-sub);">建议输入格式："晴天-周杰伦" 以获得最精准结果</div>
  </div>
</div>

<!-- 选择收藏歌单模态框 -->
<div id="savePlaylistModal" class="shared-modal">
  <div class="modal-mask" onclick="closeSavePlaylistModal()"></div>
  <div class="modal-content">
      <h2 id="t-save-title" style="margin-bottom: 24px; font-size: 20px;">收藏到指定的歌单</h2>
      <div style="position: relative; margin-bottom: 24px;">
        <select id="savePlaylistSelect" class="modern-select" style="text-align: center; text-align-last: center;"></select>
        <i class="fa-solid fa-chevron-down" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--theme-text-sub); pointer-events: none;"></i>
      </div>
      <button id="t-save-btn" class="modern-btn primary" onclick="confirmSavePlaylist()" style="width: 100%;">确认收藏</button>
  </div>
</div>

<!-- 扩展本地歌单管理模态框 (含关闭按钮) -->
<div id="playlistManagerModal" class="shared-modal">
  <div class="modal-mask" onclick="closePlaylistManager()"></div>
  <div class="modal-content" style="height: 70vh; display: flex; flex-direction: column;">
      
      <!-- 头部：歌单选择与操作 -->
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 12px;">
          <div style="position: relative; flex: 1;">
              <select id="pmActiveSelect" class="modern-select" onchange="pmChangeActive()" style="font-size: 16px; font-weight: bold;"></select>
              <i class="fa-solid fa-chevron-down" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--theme-text-sub); pointer-events: none;"></i>
          </div>
          <div style="display: flex; gap: 8px; align-items: center;">
              <button class="modern-btn default icon-only" onclick="pmCreate()" title="新建歌单"><i class="fa-solid fa-plus"></i></button>
              <button class="modern-btn danger icon-only" onclick="pmDelete()" title="删除选中歌单"><i class="fa-solid fa-trash"></i></button>
              
              <!-- 精致竖线分割与关闭按钮 -->
              <div style="width: 1px; height: 20px; background: var(--border); margin: 0 4px;"></div>

<script>
// ==================== 国际化与文本 ====================
const i18n = {

    searchTitle: '跨端点歌 / 搜索', searchInput: '输入 歌曲名 或 歌曲名-歌手...', searchPlay: '直接播放', searchClient: '客户端搜索', searchTip: '建议输入格式："晴天-周杰伦" 以获得最精准结果',

    delTitle: '删除确认', delHint: '确定要删除该歌单吗？', delConfirm: '确定删除', defaultPlaylist: '默认歌单',

  },

    searchTitle: 'Search & Play', searchInput: 'Song name or Song-Artist...', searchPlay: 'Direct Play', searchClient: 'Search in Client', searchTip: 'Format "Song-Artist" for best precision.',
    saveTitle: 'Save to Playlist', saveConfirm: 'Confirm',
    pmTitle: 'Playlist', pmInput: 'Add via Song-Artist...', pmAdd: 'Add', pmEmpty: 'Playlist is empty, add some songs!',

    delTitle: 'Confirm Delete', delHint: 'Are you sure you want to delete this playlist?', delConfirm: 'Delete', defaultPlaylist: 'Default Playlist',

  }
};
let lang = localStorage.getItem('lx_player_lang') || 'zh';
function t(k){ return i18n[lang]?.[k] || i18n.zh[k] || k; }

function toggleLanguage(){ lang = lang === 'zh' ? 'en' : 'zh'; localStorage.setItem('lx_player_lang', lang); updateAllTexts(); }
function updateAllTexts(){
  document.getElementById('startupLangBtn').textContent = lang === 'zh' ? 'EN' : '中';
  document.getElementById('langBtn').textContent = lang === 'zh' ? 'EN' : '中';
  document.getElementById('t-welcome').textContent = t('welcome');
  document.getElementById('t-desc').textContent = t('desc');
  document.getElementById('connectBtn').textContent = state.connecting ? t('connecting') : t('connect');
  document.getElementById('t-disconnect').title = t('disconnect');
  if(!state.songName) document.getElementById('songName').textContent = t('notPlaying');
  const ph = document.getElementById('lyricPlaceholder');
  if(ph) ph.textContent = state.connected ? t('noLyric') : t('lyricHint');

  if(document.getElementById('t-search-title')) document.getElementById('t-search-title').textContent = t('searchTitle');
  if(document.getElementById('searchInput')) document.getElementById('searchInput').placeholder = t('searchInput');
  if(document.getElementById('t-search-play')) document.getElementById('t-search-play').innerHTML = `<i class="fa-solid fa-play"></i> ${t('searchPlay')}`;
  if(document.getElementById('t-search-client')) document.getElementById('t-search-client').innerHTML = `<i class="fa-solid fa-magnifying-glass"></i> ${t('searchClient')}`;

  if(document.getElementById('newPlaylistNameInput')) document.getElementById('newPlaylistNameInput').placeholder = t('createInput');
  if(document.getElementById('t-create-cancel')) document.getElementById('t-create-cancel').textContent = t('cancel');
  if(document.getElementById('t-create-confirm')) document.getElementById('t-create-confirm').textContent = t('createConfirm');

  if(document.getElementById('t-del-title')) document.getElementById('t-del-title').textContent = t('delTitle');
  if(document.getElementById('deletePlaylistHint')) document.getElementById('deletePlaylistHint').textContent = t('delHint');
  if(document.getElementById('t-del-cancel')) document.getElementById('t-del-cancel').textContent = t('cancel');
  if(document.getElementById('t-del-confirm')) document.getElementById('t-del-confirm').textContent = t('delConfirm');

  if(document.getElementById('btn-lyric')) document.getElementById('btn-lyric').title = t('lyricTitle');
  if(document.getElementById('btn-mode')) document.getElementById('btn-mode').title = t('modeTitle');
  if(document.getElementById('btn-search')) document.getElementById('btn-search').title = t('searchIconTitle');
  if(document.getElementById('btn-playlist')) document.getElementById('btn-playlist').title = t('pmTitle');

  if(document.getElementById('playlistManagerModal').classList.contains('show')) {
      renderPlaylistManager();

// ==================== 扩展：本地歌单接管与上下文管理 ====================
let localPlaylists = JSON.parse(localStorage.getItem('lx_local_playlists')) || {};
let activePlaylistName = localStorage.getItem('lx_active_playlist') || ""; // 面板选择显示的歌单
let switchLock = false; 

function initPlaylistState() {
  let keys = Object.keys(localPlaylists);
  if (keys.length === 0) {
      let dName = t('defaultPlaylist');
      localPlaylists[dName] =[];
      activePlaylistName = dName;
      savePlaylists();
  } else if (!activePlaylistName || !localPlaylists[activePlaylistName]) {
      activePlaylistName = keys[0];
      savePlaylists();
  }
}

function savePlaylists() {
  localStorage.setItem('lx_local_playlists', JSON.stringify(localPlaylists));
  localStorage.setItem('lx_active_playlist', activePlaylistName);
  if (document.getElementById('playlistManagerModal').classList.contains('show')) {
      renderPlaylistManager();
  }
  updCollect(); 
}

// 核心修复：寻找当前正在播放的歌曲实际位于哪一个本地歌单
function getPlayingPlaylistContext() {
  // 优先匹配当前面板显示的歌单
  if (localPlaylists[activePlaylistName]) {
      let exists = localPlaylists[activePlaylistName].some(s => s.name === state.songName && s.artist === state.artist);
      if (exists) return activePlaylistName;
  }
  // 否则全盘扫描匹配
  for (let plName in localPlaylists) {
      if (localPlaylists[plName].some(s => s.name === state.songName && s.artist === state.artist)) {
          return plName;
      }
  }
  return null;
}

function createNewPlaylist(name) {
  if (!name) return;
  if (localPlaylists[name]) return showToast(lang==='zh'?"歌单已存在":"Playlist exists");
  localPlaylists[name] =[];
  activePlaylistName = name;
  savePlaylists();
  showToast(`${lang==='zh'?'已创建歌单':'Created'}: ${name}`);
}

function deletePlaylist(name) {
  if (!name || !localPlaylists[name]) return;
  let keys = Object.keys(localPlaylists);
  if (keys.length <= 1) return showToast(lang==='zh'?'至少需要保留一个本地歌单':'At least one playlist is required');
  
  delete localPlaylists[name];
  keys = Object.keys(localPlaylists);
  activePlaylistName = keys.length > 0 ? keys[0] : "";
  savePlaylists();
  showToast(`${lang==='zh'?'已删除歌单':'Deleted'}: ${name}`);
}

function pmCreate() {
  document.getElementById('newPlaylistNameInput').value = '';
  document.getElementById('createPlaylistModal').classList.add('show');
  setTimeout(() => document.getElementById('newPlaylistNameInput').focus(), 100);
}
function closeCreatePlaylistModal() { document.getElementById('createPlaylistModal').classList.remove('show'); }
function confirmCreatePlaylist() {
  let name = document.getElementById('newPlaylistNameInput').value.trim();
  if (!name) return showToast(lang==='zh'?'请输入新歌单名称':'Enter playlist name');
  createNewPlaylist(name);
  closeCreatePlaylistModal();
}

function pmDelete() {
  if (Object.keys(localPlaylists).length <= 1) return showToast(lang==='zh'?'至少需要保留一个本地歌单':'At least one playlist is required');
  document.getElementById('deletePlaylistModal').classList.add('show');
}
function closeDeletePlaylistModal() { document.getElementById('deletePlaylistModal').classList.remove('show'); }
function confirmDeletePlaylist() {
  deletePlaylist(activePlaylistName);
  closeDeletePlaylistModal();
}

function addSongsToPlaylist(plName, songs) {
  if (!localPlaylists[plName]) localPlaylists[plName] =[];
  let added = false;
  songs.forEach(s => {
      let exists = localPlaylists[plName].some(exist => exist.name === s.songName && exist.artist === s.artist);
      if (!exists) {
          localPlaylists[plName].push({ name: s.songName, artist: s.artist || t('unknownArtist') });
          added = true;
      }
  });
  if (added) savePlaylists();
}

function addToPlaylist(plName, name, artist) {
  addSongsToPlaylist(plName,[{ songName: name, artist: artist }]);
}

function checkCollected() {
  let list = localPlaylists[activePlaylistName] ||[];
  return list.some(s => s.name === state.songName && s.artist === state.artist);
}

// ==================== 自定义 Toast ====================
let toastTimer = null;
function showToast(msg) {
  if (document.body.classList.contains('compact')) return;
  const toast = document.getElementById('globalToast');
  toast.textContent = msg;
  toast.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 3000);
}

// ==================== 状态管理 ====================
const state = {
  apiBase: '', connected: false, connecting: false, playing: false,
  currentTime: 0, duration: 0, songName: '', artist: '', picUrl: '', lyricRaw: '',
  collected: false, volume: 50, mute: false, isSeeking: false, lastLyricIdx: -1,
  showLyrics: false, playModeIdx: 0
};
const playModes =['list-loop', 'random', 'single-loop'];
let eventSource=null, pollTimer=null;

const dom = {
  startup: document.getElementById('startupScreen'), player: document.getElementById('playerScreen'),
  portInput: document.getElementById('portInput'), connectBtn: document.getElementById('connectBtn'),
  bgBlur: document.getElementById('bgBlur'),
  albumArt: document.getElementById('albumArt'), miniCover: document.getElementById('miniCover'),
  placeholder: document.getElementById('artworkPlaceholder'),
  songName: document.getElementById('songName'), songArtist: document.getElementById('songArtist'),
  progressFill: document.getElementById('progressFill'), track: document.getElementById('progressTrack'),
  currentTime: document.getElementById('currentTime'), totalTime: document.getElementById('totalTime'),
  playBtn: document.getElementById('playBtn'),
  volumeFill: document.getElementById('volumeFill'), volumeTrack: document.getElementById('volumeTrack'), volumeIcon: document.getElementById('volumeIcon'),
  lyricSection: document.getElementById('lyricSection'), lyricInner: document.getElementById('lyricInner'),
  collectBtn: document.getElementById('collectBtn'), collectIcon: document.getElementById('collectIcon'),
  darkIcon: document.getElementById('darkIcon'), startupDarkIcon: document.getElementById('startupDarkIcon'),
  lyricBtn: document.getElementById('btn-lyric'), coverSection: document.getElementById('coverSection')
};

(function initTheme(){
  const saved = localStorage.getItem('lx_player_dark');
  if(saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme:dark)').matches)){
    document.body.classList.add('dark');
    dom.darkIcon.className = 'fa-solid fa-sun';

  const d = document.body.classList.toggle('dark');

function invokeScheme(url) {
  let iframe = document.getElementById('scheme-invoker');
  if (!iframe) { iframe = document.createElement('iframe'); iframe.id = 'scheme-invoker'; iframe.style.display = 'none'; document.body.appendChild(iframe); }

function openSearch() { document.getElementById('searchModal').classList.add('show'); setTimeout(() => document.getElementById('searchInput').focus(), 100); }
function closeSearch() { document.getElementById('searchModal').classList.remove('show'); }
function executeAction(type) {
  const kw = document.getElementById('searchInput').value.trim();
  if (!kw) return showToast(lang==='zh'?'请输入歌曲信息':'Enter song info');
  if (type === 'searchPlay') { invokeScheme(`lxmusic://music/searchPlay/${encodeURIComponent(kw)}`); showToast(`${lang==='zh'?'正在为您点播':'Playing'}: ${kw}`); }
  else { invokeScheme(`lxmusic://music/search/${encodeURIComponent(kw)}`); showToast(lang==='zh'?'已在桌面端打开搜索界面':'Search opened in client'); }
  closeSearch(); document.getElementById('searchInput').value = '';
}
function handleSearch(e) { if (e.key === 'Enter') executeAction('searchPlay'); }

function togglePlayMode() {
  state.playModeIdx = (state.playModeIdx + 1) % playModes.length;
  const mode = playModes[state.playModeIdx];
  const icon = document.getElementById('playModeIcon');
  if (mode === 'list-loop') icon.className = 'fa-solid fa-repeat';
  else if (mode === 'random') icon.className = 'fa-solid fa-shuffle';
  else if (mode === 'single-loop') icon.className = 'fa-solid fa-arrow-rotate-right';

  const textZh = mode === 'list-loop' ? '列表循环' : (mode === 'random' ? '随机播放' : '单曲循环');
  const textEn = mode === 'list-loop' ? 'List Loop' : (mode === 'random' ? 'Random' : 'Single Loop');
  showToast(`${lang==='zh'?'播放模式切换为':'Play mode'}: ${lang==='zh'?textZh:textEn}`);
  localStorage.setItem('lx_play_mode_idx', state.playModeIdx);
}

// 核心重写：完美切歌计算逻辑（支持动态定位）
function playNextFromLocal(plName, isManualSkip = false, skipPrev = false) {
  let list = localPlaylists[plName] ||[];
  if (list.length === 0) return;

  let currentIdx = list.findIndex(s => s.name === state.songName && s.artist === state.artist);
  let nextIdx = 0;

  if (currentIdx !== -1) {
      if (state.playModeIdx === 0) { // 列表循环
          nextIdx = skipPrev ? (currentIdx - 1 + list.length) % list.length : (currentIdx + 1) % list.length;
      } else if (state.playModeIdx === 1) { // 随机
          nextIdx = Math.floor(Math.random() * list.length);
      } else if (state.playModeIdx === 2) { // 单曲
          nextIdx = isManualSkip ? (skipPrev ? (currentIdx - 1 + list.length) % list.length : (currentIdx + 1) % list.length) : currentIdx;
      }
  } else {
      nextIdx = Math.floor(Math.random() * list.length); // 异常保底随机切一首
  }

  let song = list[nextIdx];
  let query = `${song.name} - ${song.artist}`;
  invokeScheme(`lxmusic://music/searchPlay/${encodeURIComponent(query)}`);
  showToast(`${lang==='zh'?'扩展已切歌':'Track skipped'}: ${query}`);
}

function doSkipNext(manual = true) {
  let plName = getPlayingPlaylistContext();
  if (plName) { playNextFromLocal(plName, manual, false); } 
  else { sendCmd('skip-next'); }
}
function doSkipPrev() {
  let plName = getPlayingPlaylistContext();
  if (plName) { playNextFromLocal(plName, true, true); } 
  else { sendCmd('skip-prev'); }
}

let songToSave = null;
function toggleCollect() {
  if (!state.songName) return showToast(t('notPlaying'));
  let list = localPlaylists[activePlaylistName];
  if (list) {
      let idx = list.findIndex(s => s.name === state.songName && s.artist === state.artist);
      if (idx !== -1) {
          list.splice(idx, 1);
          savePlaylists();
          return showToast(`${lang==='zh'?'已移除':'Removed from'} ${activePlaylistName}`);
      }
  }

  let keys = Object.keys(localPlaylists);
  if (keys.length === 0) {
      let dName = t('defaultPlaylist');
      localPlaylists[dName] =[];
      activePlaylistName = dName;
      keys = [dName];
  }

  if (keys.length === 1) {
      addToPlaylist(keys[0], state.songName, state.artist);
      showToast(`${lang==='zh'?'已收藏到':'Saved to'} ${keys[0]}`);
  } else {
      songToSave = { name: state.songName, artist: state.artist };
      showSavePlaylistModal();
  }
}

function showSavePlaylistModal() {

function closeSavePlaylistModal() { document.getElementById('savePlaylistModal').classList.remove('show'); songToSave = null; }
function confirmSavePlaylist() {

async function toggleConnection(){
  if(state.connecting) return;
  const port = parseInt(dom.portInput.value) || 23330;
  state.apiBase = `http://127.0.0.1:${port}`;
  state.connecting = true; updateAllTexts();
  
  try {
    const r = await fetch(`${state.apiBase}/status?filter=status`, { signal: AbortSignal.timeout(3000) });
    if(!r.ok) throw Error('API error');
    state.connected = true; state.connecting = false;
    localStorage.setItem('lx_api_port', port);
    updateAllTexts(); showPlayer(); showToast(lang==='zh'?'已成功连接桌面端引擎':'Engine connected');
    startPoll(); connectSSE();
  } catch(e) {
    state.connecting = false; updateAllTexts();
    showToast(`${lang==='zh'?'连接失败':'Connection failed'}: ${e.message}`);
  }
}
function disconnect(){
  state.connected = false;
  if(eventSource) { eventSource.close(); eventSource = null; }
  if(pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  resetUI(); showStartup();
}

function connectSSE(){
  if(eventSource) eventSource.close();
  try{
    eventSource = new EventSource(`${state.apiBase}/subscribe-player-status`);['status','name','singer','duration','progress','picUrl','lyricLineText','collect','volume','mute'].forEach(ev => {
      eventSource.addEventListener(ev, e => handleData(ev, e.data.replace(/^"|"$/g,'')));
    });
    eventSource.onerror = () => { eventSource.close(); eventSource = null; };
  }catch(e){ eventSource = null; }
}

function startPoll(){
  if(pollTimer) clearInterval(pollTimer);
  const poll = async () => {
    if(!state.connected || state.isSeeking) return;
    try{
      const r = await fetch(`${state.apiBase}/status?filter=status,name,singer,duration,progress,picUrl,lyricLineText,collect,volume,mute`, {signal: AbortSignal.timeout(2000)});
      if(!r.ok) return;
      const d = await r.json();
      if(d.status) handleData('status', d.status);
      if(d.name !== undefined) handleData('name', d.name);
      if(d.singer !== undefined) handleData('singer', d.singer);
      if(d.duration !== undefined) handleData('duration', d.duration);
      if(d.progress !== undefined) handleData('progress', d.progress);
      if(d.picUrl !== undefined) handleData('picUrl', d.picUrl);
      if(d.lyricLineText !== undefined) handleData('lyricLineText', d.lyricLineText);
      if(d.volume !== undefined) handleData('volume', d.volume);
      if(d.mute !== undefined) handleData('mute', String(d.mute));
    }catch(e){}
  };
  poll(); pollTimer = setInterval(poll, 1000);
}

function handleData(key, val) {
  switch(key){
    case 'status': state.playing = (val === 'playing'); updatePlayBtn(); break;
    case 'name': 
        if(state.songName !== val) { state.songName = val; dom.songName.textContent = val || t('notPlaying'); updateMediaSession(); updCollect(); if(document.getElementById('playlistManagerModal').classList.contains('show')){ renderPlaylistManager(); } } 
        break;
    case 'singer': 
        if(state.artist !== val) { state.artist = val; dom.songArtist.textContent = val || t('unknownArtist'); updateMediaSession(); updCollect(); if(document.getElementById('playlistManagerModal').classList.contains('show')){ renderPlaylistManager(); } }
        break;
    case 'duration': state.duration = parseFloat(val); dom.totalTime.textContent = fmt(state.duration); break;
    case 'progress': state.currentTime = parseFloat(val); if(!state.isSeeking) updProgress(); updLyric(); break;
    case 'picUrl': if(state.picUrl !== val) { state.picUrl = val; updArt(); updateMediaSession(); } break;
    case 'lyricLineText': if(val !== state.lyricRaw){ state.lyricRaw = val; updLyricDisplay(); } break;
    case 'volume': state.volume = parseInt(val); updVol(); break;
    case 'mute': state.mute = (val === 'true'); updVolIcon(); break;
  }
}

function updatePlayBtn(){ dom.playBtn.innerHTML = state.playing ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play" style="margin-left:3px"></i>'; }
function updProgress(){
  if(state.duration > 0) dom.progressFill.style.width = Math.min((state.currentTime/state.duration)*100, 100) + '%';
  else dom.progressFill.style.width = '0%';
  dom.currentTime.textContent = fmt(state.currentTime);

  // 【核心修复】：必须满足 state.playing = true 才能接管切歌，防止AI在停止状态下塞歌引发无限循环！
  if (state.playing && state.duration > 0 && state.currentTime >= state.duration - 1.5) {
      let plName = getPlayingPlaylistContext();
      if (!switchLock && plName) {
          switchLock = true;
          setTimeout(() => { switchLock = false; }, 4000);
          doSkipNext(false); 
      }
  }
}
function updVol(){ dom.volumeFill.style.width = state.volume + '%'; updVolIcon(); }
function updVolIcon(){
  if(state.mute || state.volume === 0) dom.volumeIcon.className = 'fa-solid fa-volume-xmark';
  else if(state.volume < 50) dom.volumeIcon.className = 'fa-solid fa-volume-low';
  else dom.volumeIcon.className = 'fa-solid fa-volume-high';
}
function updArt(){
  if(state.picUrl){
    dom.albumArt.src = state.picUrl; dom.albumArt.style.opacity = '1';
    dom.miniCover.src = state.picUrl; dom.miniCover.style.opacity = '1';
    dom.placeholder.style.opacity = '0'; dom.bgBlur.style.backgroundImage = `url(${state.picUrl})`;
  } else {
    dom.albumArt.style.opacity = '0'; dom.miniCover.style.opacity = '0';
    dom.placeholder.style.opacity = '1'; dom.bgBlur.style.backgroundImage = 'none';
  }
}
function updCollect() {
  state.collected = checkCollected();
  if(state.collected){ dom.collectIcon.className = 'fa-solid fa-heart'; dom.collectBtn.classList.add('collected'); }
  else{ dom.collectIcon.className = 'fa-regular fa-heart'; dom.collectBtn.classList.remove('collected'); }
}
function updLyricDisplay(){
  if(!state.lyricRaw){ dom.lyricInner.innerHTML = `<div style="height: 35vh; flex-shrink: 0;"></div><div class="lyric-line active" id="lyricPlaceholder">${state.connected ? t('noLyric') : t('lyricHint')}</div><div style="height: 60vh; flex-shrink: 0;"></div>`; return; }
  const lines = parseLRC(state.lyricRaw);
  if(!lines.length){ dom.lyricInner.innerHTML = `<div style="height: 35vh; flex-shrink: 0;"></div><div class="lyric-line active">${esc(state.lyricRaw)}</div><div style="height: 60vh; flex-shrink: 0;"></div>`; return; }
  dom.lyricInner.innerHTML = '<div style="height: 35vh; flex-shrink: 0;"></div>' + lines.map((l,i) => `<div class="lyric-line" data-t="${l.time}" data-i="${i}">${esc(l.text)}</div>`).join('') + '<div style="height: 60vh; flex-shrink: 0;"></div>';
  state.lastLyricIdx = -1; updLyric();
}
function parseLRC(t){
  const lines =[], re = /\[(\d{2}):(\d{2}(?:\.\d+)?)\](.*)/g; let m;
  while((m = re.exec(t)) !== null){ const s = parseInt(m[1])*60 + parseFloat(m[2]), txt = m[3].trim(); if(txt) lines.push({time: s, text: txt}); }
  return lines.sort((a,b) => a.time - b.time);
}
function updLyric(){
  const ls = dom.lyricInner.querySelectorAll('.lyric-line[data-t]');
  if(!ls.length) return;
  let idx = -1; const current = state.currentTime;
  ls.forEach((l,i) => { if(current >= parseFloat(l.dataset.t) - 0.3) idx = i; });
  if(idx !== state.lastLyricIdx){
    ls.forEach(l => l.classList.remove('active'));
    if(idx >= 0){
      const el = ls[idx]; el.classList.add('active');
      const container = dom.lyricSection;
      const targetScroll = el.offsetTop - (container.clientHeight * 0.35) + (el.clientHeight / 2);
      container.scrollTo({ top: targetScroll, behavior: 'smooth' });
    }
    state.lastLyricIdx = idx;
  }
}
function resetUI(){
  state.playing=false; state.currentTime=0; state.duration=0; state.songName=''; state.artist=''; state.picUrl=''; state.lyricRaw=''; state.collected=false;
  dom.songName.textContent = t('notPlaying'); dom.songArtist.textContent = '--';
  dom.albumArt.style.opacity = '0'; dom.miniCover.style.opacity = '0'; dom.placeholder.style.opacity = '1'; dom.bgBlur.style.backgroundImage = 'none';
  dom.progressFill.style.width = '0%'; dom.currentTime.textContent = '00:00'; dom.totalTime.textContent = '00:00';
  dom.lyricInner.innerHTML = `<div style="height:35vh"></div><div class="lyric-line active" id="lyricPlaceholder">${t('lyricHint')}</div><div style="height:60vh"></div>`;
  updatePlayBtn(); updCollect();
}
function toggleLyricView() {
  state.showLyrics = !state.showLyrics;
  if(state.showLyrics) { dom.lyricBtn.classList.add('active'); document.body.classList.add('immersion'); dom.lyricSection.style.display = 'block'; setTimeout(() => updLyric(), 50); } 
  else { dom.lyricBtn.classList.remove('active'); document.body.classList.remove('immersion'); dom.lyricSection.style.display = 'none'; }
}

function updateMediaSession() {
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: state.songName || t('notPlaying'),
      artist: state.artist || t('unknownArtist'),
      artwork: state.picUrl ?[{ src: state.picUrl, sizes: '512x512', type: 'image/jpeg' }] :[]
    });
  }
}
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => { sendCmd('play'); state.playing=true; updatePlayBtn(); });
  navigator.mediaSession.setActionHandler('pause', () => { sendCmd('pause'); state.playing=false; updatePlayBtn(); });
  navigator.mediaSession.setActionHandler('previoustrack', () => doSkipPrev());
  navigator.mediaSession.setActionHandler('nexttrack', () => doSkipNext(true));
}

function startSeek(e, type){
  e.preventDefault();
  const isProgress = (type === 'progress');
  if(isProgress) state.isSeeking = true;
  const track = isProgress ? dom.track : dom.volumeTrack;
  const fill = isProgress ? dom.progressFill : dom.volumeFill;
  const rect = track.getBoundingClientRect();
  
  const updatePos = (cX) => {
    let p = Math.max(0, Math.min(1, (cX - rect.left) / rect.width));
    fill.style.width = (p * 100) + '%';
    if(isProgress) dom.currentTime.textContent = fmt(p * state.duration);
    else { state.volume = Math.round(p * 100); updVolIcon(); sendCmd('volume', { volume: state.volume }); }
  };
  
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  updatePos(clientX);
  const mv = ev => updatePos(ev.touches ? ev.touches[0].clientX : ev.clientX);
  const end = ev => {
    document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', end);
    document.removeEventListener('touchmove', mv); document.removeEventListener('touchend', end);
    if(isProgress) {
      const cX = ev.changedTouches ? ev.changedTouches[0].clientX : ev.clientX;
      const p = Math.max(0, Math.min(1, (cX - rect.left) / rect.width));
      const offset = Math.round(p * state.duration);
      sendCmd('seek', { offset });
      state.currentTime = offset; state.isSeeking = false; updLyric();
    }
  };
  document.addEventListener('mousemove', mv); document.addEventListener('mouseup', end);
  document.addEventListener('touchmove', mv, {passive: false}); document.addEventListener('touchend', end);
}

async function sendCmd(cmd, params={}){
  if(!state.connected) return;
  try{ const q = new URLSearchParams(params).toString(); await fetch(`${state.apiBase}/${cmd}${q ? '?'+q : ''}`, { method: 'GET', signal: AbortSignal.timeout(2000) }); }catch(e){}
}
function togglePlay(){ sendCmd(state.playing ? 'pause' : 'play'); state.playing = !state.playing; updatePlayBtn(); }
function toggleMute(){ state.mute = !state.mute; sendCmd('mute', { mute: state.mute }); updVolIcon(); }
function fmt(s){ if(!s || isNaN(s)) return '00:00'; const m = Math.floor(s/60), sec = Math.floor(s%60); return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0'); }
function esc(t){ const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT' || !state.connected) return;
  switch(e.code){
    case 'Space': e.preventDefault(); togglePlay(); break;
    case 'ArrowLeft': e.preventDefault(); sendCmd('seek', {offset: Math.max(0, state.currentTime - 5)}); break;
    case 'ArrowRight': e.preventDefault(); sendCmd('seek', {offset: Math.min(state.duration, state.currentTime + 5)}); break;
    case 'ArrowUp': e.preventDefault(); state.volume=Math.min(100, state.volume+5); sendCmd('volume', {volume: state.volume}); updVol(); break;
    case 'ArrowDown': e.preventDefault(); state.volume=Math.max(0, state.volume-5); sendCmd('volume', {volume: state.volume}); updVol(); break;
  }
});

// ==================== MCP / 主程序 AI 集成 ====================
let ws = null; let MY_EXT_ID = '';
function getExtId() { try { const match = window.location.pathname.match(/\/extensions\/([^\/]+)/); MY_EXT_ID = match ? match[1] : 'lx-music-ext'; } catch(e) { MY_EXT_ID = 'lx-music-ext'; } return MY_EXT_ID; }

function initWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);
  
  ws.onopen = () => {
    const extId = getExtId();
    ws.send(JSON.stringify({
      type: 'register_node_extension_mcp',
      data: {
        ext_id: extId,
        tools:[
          { name: `${extId}_play_pause`, description: '切换当前音乐的播放/暂停状态', parameters: { type: 'object', properties: {} } },
          { name: `${extId}_next_song`, description: '播放下一首歌曲', parameters: { type: 'object', properties: {} } },
          { name: `${extId}_prev_song`, description: '播放上一首歌曲', parameters: { type: 'object', properties: {} } },
          { name: `${extId}_set_volume`, description: '设置音量大小', parameters: { type: 'object', properties: { volume: { type: 'number', description: '音量值 0-100' } }, required:['volume'] } },
          { name: `${extId}_search_and_play`, description: '搜索并直接播放指定歌曲', parameters: { type: 'object', properties: { keyword: { type: 'string', description: '歌曲名或歌手名' } }, required:['keyword'] } },
          { name: `${extId}_toggle_collect`, description: '收藏或取消收藏到当前的默认本地歌单', parameters: { type: 'object', properties: {} } },
          { name: `${extId}_query_playlists`, description: '查询所有的本地扩展歌单名', parameters: { type: 'object', properties: {} } },
          { name: `${extId}_create_playlist`, description: '创建一个新的本地歌单', parameters: { type: 'object', properties: { name: { type: 'string', description: '新歌单名称' } }, required: ['name'] } },
          { name: `${extId}_play_playlist`, description: '切换到指定的本地歌单并主动开始接管播放', parameters: { type: 'object', properties: { name: { type: 'string', description: '要播放的歌单名称' } }, required:['name'] } },
          { name: `${extId}_delete_playlist`, description: '彻底删除指定的本地歌单', parameters: { type: 'object', properties: { name: { type: 'string', description: '要删除的歌单名称' } }, required:['name'] } },
          { 
            name: `${extId}_add_song_to_current`, 
            description: '主动将一首或多首歌曲加入当前选中本地歌单（仅在后台进行本地数据追加存储，绝对不会触发任何形式的播放、切歌、搜索或客户端操作。请注意：在调用此工具后，绝对禁止调用任何其它播放工具或切歌工具）', 
            parameters: { 
                type: 'object', 
                properties: { 
                    songName: { type: 'string', description: '单曲的歌曲名' }, 
                    artist: { type: 'string', description: '单曲的歌手名' },
                    songs: { 
                        type: 'array', 
                        description: '批量添加的多首歌曲列表',
                        items: { type: 'object', properties: { songName: { type: 'string' }, artist: { type: 'string' } }, required:['songName'] }
                    }
                }
            } 
          },
          { name: `${extId}_query_current_playlist_songs`, description: '查询当前选中歌单的所有歌曲', parameters: { type: 'object', properties: {} } },
          { name: `${extId}_remove_song_from_current`, description: '从当前歌单中删除指定的歌曲', parameters: { type: 'object', properties: { songName: { type: 'string' } }, required: ['songName'] } },
          { name: `${extId}_get_current_song_name`, description: '查询当前正在播放的歌曲的歌名', parameters: { type: 'object', properties: {} } },
          { name: `${extId}_get_current_song_info`, description: '查询当前正在播放的歌曲详细信息（歌名、歌手、播放总时长、当前已播放时间、播放状态、封面图等）', parameters: { type: 'object', properties: {} } },

async function handleMcpCall(data) {
  const { ext_id, tool_name, tool_params, call_id } = data;
  if (ext_id !== MY_EXT_ID && !tool_name.includes(MY_EXT_ID)) return;
  
  let resultStr = 'success';
  try {
    let params = tool_params;
    if (typeof params === 'string') { try { params = JSON.parse(params); } catch(e) {} }

    if (tool_name.includes('_play_pause')) { togglePlay(); resultStr = state.playing ? '已暂停' : '已播放'; } 
    else if (tool_name.includes('_next_song')) { doSkipNext(true); resultStr = '已切下一首'; } 
    else if (tool_name.includes('_prev_song')) { doSkipPrev(); resultStr = '已切上一首'; } 
    else if (tool_name.includes('_set_volume')) {
      const vol = Math.max(0, Math.min(100, params.volume || 50));
      state.volume = vol; sendCmd('volume', { volume: state.volume }); updVol(); resultStr = `音量已调整为 ${vol}%`;
    } 
    else if (tool_name.includes('_search_and_play')) {
      if (params.keyword) { invokeScheme(`lxmusic://music/searchPlay/${encodeURIComponent(params.keyword)}`); resultStr = `正在播放: ${params.keyword}`; } 
      else { resultStr = '失败：无关键词'; }
    } 
    else if (tool_name.includes('_toggle_collect')) {
      if (!state.songName) { resultStr = '失败：当前未播放音乐'; } 
      else { toggleCollect(); resultStr = state.collected ? `已收藏` : `已取消收藏`; }
    }
    else if (tool_name.includes('_query_playlists')) { resultStr = JSON.stringify(Object.keys(localPlaylists)); }
    else if (tool_name.includes('_create_playlist')) {
      if(!params.name) { resultStr = "未提供歌单名"; } else if(localPlaylists[params.name]) { resultStr = "歌单已存在"; }
      else { createNewPlaylist(params.name); resultStr = `已成功创建歌单: ${params.name}`; }
    }
    else if (tool_name.includes('_play_playlist')) {
      if(!localPlaylists[params.name]) { resultStr = "指定歌单不存在"; } else if(localPlaylists[params.name].length === 0) { resultStr = "该歌单中没有歌曲"; }
      else { activePlaylistName = params.name; savePlaylists(); playSpecificSong(0); resultStr = `已接管并播放歌单: ${params.name}`; }
    }
    else if (tool_name.includes('_delete_playlist')) {
      if(!localPlaylists[params.name]) { resultStr = "指定歌单不存在"; } 
      else if(Object.keys(localPlaylists).length <= 1) { resultStr = "至少需要保留一个本地歌单"; }
      else { deletePlaylist(params.name); resultStr = `已删除歌单: ${params.name}`; }
    }
    else if (tool_name.includes('_add_song_to_current')) {
      if (!activePlaylistName) { 
          resultStr = "当前没有任何歌单可以添加"; 
      } else { 
          let songsToAdd =[];
          if (params.songs && Array.isArray(params.songs)) {
              songsToAdd = params.songs.filter(s => s.songName).map(s => ({ songName: s.songName, artist: s.artist || t('unknownArtist') }));
          } else if (params.songName) {
              songsToAdd.push({ songName: params.songName, artist: params.artist || t('unknownArtist') });
          }
          
          if (songsToAdd.length > 0) {
              addSongsToPlaylist(activePlaylistName, songsToAdd);
              resultStr = `已成功将 ${songsToAdd.length} 首歌曲加入本地歌单 ${activePlaylistName}（已静默添加，未执行任何播放，切忌主动伴随播放指令）`;
          } else {
              resultStr = "未提供有效的歌曲名称数据";
          }
      }
    }
    else if (tool_name.includes('_query_current_playlist_songs')) { resultStr = (!activePlaylistName || !localPlaylists[activePlaylistName]) ? "[]" : JSON.stringify(localPlaylists[activePlaylistName]); }
    else if (tool_name.includes('_remove_song_from_current')) {
      if(!params.songName) { resultStr = "未提供歌曲名称"; } else if(!activePlaylistName || !localPlaylists[activePlaylistName]) { resultStr = "当前没有激活的歌单"; }
      else {
        let list = localPlaylists[activePlaylistName]; let initialLen = list.length;
        localPlaylists[activePlaylistName] = list.filter(s => s.name !== params.songName);
        if(localPlaylists[activePlaylistName].length < initialLen) { savePlaylists(); resultStr = `已从歌单中移除歌曲: ${params.songName}`; } 
        else { resultStr = `未找到指定歌曲`; }
      }
    }
    else if (tool_name.includes('_get_current_song_name')) {
      resultStr = state.songName || "未在播放音乐";
    }
    else if (tool_name.includes('_get_current_song_info')) {
      resultStr = JSON.stringify({
        songName: state.songName || "未在播放音乐",
        artist: state.artist || "未知歌手",
        duration: state.duration,
        currentTime: state.currentTime,
        progressPercent: state.duration > 0 ? ((state.currentTime / state.duration) * 100).toFixed(2) + '%' : '0%',
        playing: state.playing,
        picUrl: state.picUrl || ''
      });
    }
    else if (tool_name.includes('_get_current_lyric')) {
      if (!state.lyricRaw) {
        resultStr = "当前无歌词";
      } else {
        const lines = parseLRC(state.lyricRaw);
        if (!lines.length) {
          resultStr = state.lyricRaw;
        } else {
          let activeText = "当前无歌词";
          const current = state.currentTime;
          let idx = -1;
          lines.forEach((l, i) => { if (current >= l.time - 0.3) idx = i; });
          if (idx >= 0 && lines[idx]) {
            activeText = lines[idx].text;
          }
          resultStr = activeText;
        }
      }
    }
    else { resultStr = `未知指令`; }
  } catch (e) { resultStr = `执行异常: ${e.message}`; }
  
  if (ws && ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify({ type: 'mcp_tool_result', data: { call_id: call_id, result: resultStr } })); }
}

function closeWindow() { window.close(); }

(function init(){
  initPlaylistState(); 

  let savedPlayMode = localStorage.getItem('lx_play_mode_idx');
  if (savedPlayMode !== null) {
      state.playModeIdx = parseInt(savedPlayMode) || 0;
      const mode = playModes[state.playModeIdx];
      const icon = document.getElementById('playModeIcon');
      if (icon) {
        if (mode === 'list-loop') icon.className = 'fa-solid fa-repeat';
        else if (mode === 'random') icon.className = 'fa-solid fa-shuffle';
        else if (mode === 'single-loop') icon.className = 'fa-solid fa-arrow-rotate-right';
      }
  }

  const p = localStorage.getItem('lx_api_port');
  if(p) dom.portInput.value = p;

  function checkCompactMode() {
    if (window.innerHeight < 200) { document.documentElement.classList.add('compact'); document.body.classList.add('compact'); } 
    else { document.documentElement.classList.remove('compact'); document.body.classList.remove('compact'); }
  }
  checkCompactMode(); window.addEventListener('resize', checkCompactMode);
  updateAllTexts();
  if (window.innerWidth <= 768 && !document.body.classList.contains('compact')) { toggleLyricView(); }
  initWS();
})();

window.addEventListener('beforeunload', () => { 
  if (ws && ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify({ type: 'unregister_node_extension_mcp', data: { ext_id: MY_EXT_ID } })); }
  if(state.connected) disconnect(); 
});
</script>
